name: Validate NameForge for Cloudflare Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nameforge-cloudflare-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit npm dependency vulnerabilities
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit.json || true
          node -e "const fs=require('fs'); let a; try { a=JSON.parse(fs.readFileSync('artifacts/npm-audit.json','utf8')); } catch (e) { console.error('npm audit did not return valid JSON:', e.message); process.exit(1); } const counts=a.metadata?.vulnerabilities; if (!counts) { console.error('npm audit response is missing vulnerability metadata'); process.exit(1); } console.log('npm audit:', JSON.stringify(counts)); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + item.severity + ', direct=' + item.isDirect + ', range=' + item.range + ', fixAvailable=' + JSON.stringify(item.fixAvailable)); if ((counts.total ?? 0) > 0) { console.error('Dependency audit failed: vulnerabilities remain.'); process.exit(1); }"

      - name: Type-check
        run: npm run lint

      - name: Run regression tests
        run: npm test

      - name: Audit localization coverage
        run: npm run audit:i18n

      - name: Build for Cloudflare Pages
        run: npm run build

      - name: Run Playwright browser QA
        run: npm run test:browser

      - name: Run Lighthouse against local production build
        run: npm run audit:lighthouse

      - name: Upload QA and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nameforge-cloudflare-quality-reports
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
